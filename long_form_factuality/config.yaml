models:
  - model_name: Llama3.2-3B
    hf_model_name: meta-llama/Llama-3.2-3B-Instruct
    scores_filepath: metrics/longfact_gen_25_llama3_3b.pkl
    top_n_dims: 3
  - model_name: Llama3.1-8B
    hf_model_name: meta-llama/Meta-Llama-3.1-8B-Instruct
    scores_filepath: metrics/longfact_gen_50_llama3_8b.pkl
    top_n_dims: 5
  - model_name: Llama3.1-70B
    hf_model_name: meta-llama/Meta-Llama-3.1-70B-Instruct
    scores_filepath: metrics/longfact_gen_75_llama3_70b.pkl
    top_n_dims: 8
  # - model_name: Gemma2-9B
  #   hf_model_name: google/gemma-2-9b-it
  #   scores_filepath: metrics/longfact_gen_25_gemma2_9b.pkl
  #   top_n_dims: 8

probe_parameters:
  C_full: 0.025
  C_sparse: 0.5

general_settings:
  token_pos: lt  # Options: 'lt', 'slt', 'fgt'
  device: cuda
  max_memory: 80GIB
  results_dir: ./results
